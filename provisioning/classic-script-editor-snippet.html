<!--
  PASTE THIS into a Script Editor Web Part (or Content Editor Web Part) on a classic page.

  Adjust the <script src> path and the *ServerRelativeUrl / skin / icon paths so they
  match the site that hosts SiteAssets. If the web part is on the SAME web whose
  SiteAssets holds the files, you can DELETE the optional lines below and the bundle
  will auto-derive them from _spPageContextInfo. Only the <script src> path is required.

  Bump ?v= whenever you upload a new bundle so browsers fetch the new file.
-->
<div id="discussionFeedRoot"></div>

<script type="text/javascript"
        src="/sites/CBSL/SiteAssets/discussion-feed.bundle.js?v=1.0.0"></script>

<script type="text/javascript">
  (function () {
    function start() {
      if (window.DiscussionFeedApp && window.DiscussionFeedApp.render) {
        window.DiscussionFeedApp.render({
          containerId: 'discussionFeedRoot'
          // --- optional overrides (defaults derive from the current web's SiteAssets) ---
          // , postsListTitle: 'DiscussionPosts'
          // , commentsListTitle: 'DiscussionComments'
          // , assetLibraryServerRelUrl: '/sites/CBSL/SiteAssets'
          // , tinymceSkinUrl: '/sites/CBSL/SiteAssets/tinymce/skins/lightgray'
          // , fabricIconBaseUrl: '/sites/CBSL/SiteAssets/fabric-icons/'
          // , pageSize: 20
        });
      } else {
        setTimeout(start, 50);   // wait for the bundle to finish downloading
      }
    }
    start();
  })();
</script>
